[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-wallet-xno"
version = "1.3.0"
description = "Nano (XNO) wallet as one install, with a receive-only profile an operator can verify: create, validate, balance, receive. No dependencies, no custody, send not registered."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["nano", "xno", "wallet", "mcp", "a2a", "agent", "payments", "x402"]

[project.scripts]
nano-wallet = "nano_wallet_xno.cli:main"
mandate = "nano_wallet_xno.mandate:main"
nano-keygen = "nano_wallet_xno.nano_keygen:main"
nano-pay402 = "nano_wallet_xno.pay402:main"
nano-capped-wallet = "nano_wallet_xno.capped_wallet:main"

[tool.setuptools.packages.find]
include = ["nano_wallet_xno*"]
