[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-wallet-xno"
version = "1.1.0"
description = "Nano (XNO) wallet as one install, with a receive-only profile an operator can verify: create, validate, balance, receive. No dependencies, no custody, send not registered."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["nano", "xno", "wallet", "mcp", "a2a", "agent", "payments", "x402"]

[project.scripts]
nano-wallet = "cli:main"
mandate = "mandate:main"

[tool.setuptools]
py-modules = ["nanoaddr", "ed25519_blake2b", "wallet", "cli", "mcp_server",
              "profiles", "capabilities", "selfcheck", "payments", "blocks",
              "keystore", "nanonode", "fakenode", "wellknown",
              "mandate", "work", "prework"]
